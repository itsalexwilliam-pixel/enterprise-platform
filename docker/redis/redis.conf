# ============================================================
# Redis Configuration
# Enterprise Email Validation Platform
# Optimized for high-throughput caching & rate limiting
# ============================================================

# Network
bind 0.0.0.0
port 6379
protected-mode yes
requirepass REDIS_STRONG_PASSWORD

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence (AOF + RDB)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300
hz 10
dynamic-hz yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Keyspace notifications (for Laravel Queue events)
notify-keyspace-events ""

# Active defrag (Redis 7.x uses 'activedefrag' only)
activedefrag yes

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Databases (16 by default, we use 0-4)
databases 16

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Clients
maxclients 10000
