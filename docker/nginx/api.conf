# ============================================================
# NGINX Virtual Host - Email Validation API
# Enterprise Email Validation Platform
# ============================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Connection Limits
    limit_conn conn_limit 20;

    # Health Check (no rate limiting)
    location = /health {
        access_log off;
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    # API Routes with rate limiting
    location /api/ {
        # Rate limiting per API key
        limit_req zone=key_limit burst=100 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;

        # CORS Headers for API
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, Accept" always;
        add_header Access-Control-Max-Age 86400;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Auth routes with strict rate limiting
    location ~ ^/(login|register|forgot-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # PHP Processing
    location ~ \.php$ {
        fastcgi_pass api_servers;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Security
        fastcgi_param PHP_VALUE "max_execution_time=300";
        fastcgi_hide_header X-Powered-By;
    }

    # Main Application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(\.env|composer\.(json|lock)|package\.json|webpack\.mix\.js) {
        deny all;
        return 404;
    }
}

