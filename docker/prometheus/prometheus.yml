global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'email-validator'

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-server-1'
    static_configs:
      - targets: ['api_server_1:9000']
    metrics_path: /metrics

  - job_name: 'api-server-2'
    static_configs:
      - targets: ['api_server_2:9000']
    metrics_path: /metrics

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: /nginx_status

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql_master:3306']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics
