; ============================================================
; PHP-FPM Pool Configuration (www)
; Enterprise Email Validation Platform
; ============================================================

[www]

; TCP port 9000 (matches Dockerfile EXPOSE 9000 and Nginx upstream)
listen = 9000

; Run as www-data
user = www-data
group = www-data

; Dynamic process manager
pm = dynamic
pm.start_servers = 2
pm.max_children = 20
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 300s

; Pass env vars from Docker into PHP
clear_env = no

; Status endpoint
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Output to Docker logs (no file paths needed)
catch_workers_output = yes
decorate_workers_output = no
