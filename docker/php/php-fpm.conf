; ============================================================
; PHP-FPM Pool Configuration (www)
; Enterprise Email Validation Platform
; Optimized for production API servers
; ============================================================

[www]

; Unix socket (Nginx communicates via this)
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Run as www-data
user = www-data
group = www-data

; Process manager: dynamic for production
pm = dynamic

; Number of child processes at startup
pm.start_servers = 4

; Limits
pm.max_children = 50
pm.min_spare_servers = 2
pm.max_spare_servers = 10

; Recycle workers after N requests (prevent memory leaks)
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 300s
request_slowlog_timeout = 30s

; Logging
slowlog = /var/log/php-fpm/slow.log
access.log = /var/log/php-fpm/access.log
access.format = "%R - %u %t \"%m %r\" %s %f %{mili}dms %{kilo}MMb cpu:%C%%"

; Environment variables passed to PHP
clear_env = no

; Status page (for monitoring)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Security
catch_workers_output = yes
decorate_workers_output = no
