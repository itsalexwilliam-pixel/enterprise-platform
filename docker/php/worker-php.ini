; ============================================================
; PHP CLI Configuration for Queue Workers
; Enterprise Email Validation Platform
; Optimized for long-running SMTP/DNS/Bulk workers
; ============================================================

[PHP]
; Error handling
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php/worker-error.log

; Workers need longer execution time (SMTP can be slow)
max_execution_time = 0
max_input_time = -1

; More memory for bulk file processing
memory_limit = 1G

; File uploads (workers handle bulk CSV/XLSX)
file_uploads = On
upload_max_filesize = 100M
post_max_size = 110M

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Date
date.timezone = UTC

; Sockets (for SMTP connections)
; No restrictions needed for CLI workers

[opcache]
; Enable for CLI to cache Laravel framework files
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0
opcache.fast_shutdown=1

; JIT for CLI workers
opcache.jit_buffer_size=50M
opcache.jit=1255
