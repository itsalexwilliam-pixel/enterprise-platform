; ============================================================
; Supervisor Configuration
; Enterprise Email Validation Platform Worker Management
; ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ============================================================
; SMTP VALIDATION WORKERS (4 concurrent workers)
; Each handles ~25 emails/sec = 100 total emails/sec
; ============================================================
[program:smtp-worker]
command=php /var/www/html/artisan queue:work rabbitmq
    --queue=smtp_validation
    --tries=3
    --timeout=60
    --sleep=1
    --max-jobs=1000
    --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=90
killasgroup=true
stopasgroup=true
stdout_logfile=/var/log/supervisor/smtp-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/smtp-worker-error.log
stderr_logfile_maxbytes=10MB
environment=QUEUE_WORKER_TYPE="smtp"

; ============================================================
; DNS VALIDATION WORKERS (2 concurrent workers)
; DNS is faster than SMTP, fewer workers needed
; ============================================================
[program:dns-worker]
command=php /var/www/html/artisan queue:work rabbitmq
    --queue=dns_validation
    --tries=3
    --timeout=30
    --sleep=1
    --max-jobs=2000
    --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/dns-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=QUEUE_WORKER_TYPE="dns"

; ============================================================
; BULK PROCESSING WORKERS (2 concurrent workers)
; Handles large file uploads - long running jobs
; ============================================================
[program:bulk-worker]
command=php /var/www/html/artisan queue:work rabbitmq
    --queue=bulk_processing
    --tries=1
    --timeout=7200
    --sleep=2
    --max-time=86400
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=300
stdout_logfile=/var/log/supervisor/bulk-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=QUEUE_WORKER_TYPE="bulk"

; ============================================================
; WEBHOOK DELIVERY WORKERS (1 worker)
; ============================================================
[program:webhook-worker]
command=php /var/www/html/artisan queue:work rabbitmq
    --queue=webhooks
    --tries=5
    --timeout=30
    --sleep=1
    --max-jobs=5000
    --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/var/log/supervisor/webhook-worker.log
stdout_logfile_maxbytes=10MB
environment=QUEUE_WORKER_TYPE="webhook"

; ============================================================
; REPORT GENERATION WORKERS (1 worker)
; ============================================================
[program:report-worker]
command=php /var/www/html/artisan queue:work rabbitmq
    --queue=reports
    --tries=2
    --timeout=300
    --sleep=5
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/report-worker.log

; ============================================================
; LARAVEL SCHEDULER (runs every minute)
; ============================================================
[program:scheduler]
command=php /var/www/html/artisan schedule:work
process_name=%(program_name)s
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
