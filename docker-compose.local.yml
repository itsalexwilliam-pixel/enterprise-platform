version: '3.8'

# ============================================================
# LOCAL DEVELOPMENT - Docker Compose
# Simple setup: MySQL + Redis + RabbitMQ + PHP + Nginx
# Run with: docker-compose -f docker-compose.local.yml up -d
# ============================================================

networks:
  ev_local:
    driver: bridge

volumes:
  mysql_local_data:
  redis_local_data:
  rabbitmq_local_data:

services:

  # ============================================================
  # NGINX (Web Server)
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ev_nginx
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ev_local
    depends_on:
      - php

  # ============================================================
  # PHP 8.3 FPM (Application)
  # ============================================================
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    container_name: ev_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/local-php.ini:/usr/local/etc/php/php.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - ev_local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # QUEUE WORKER (Single local worker)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    container_name: ev_worker
    restart: unless-stopped
    command: php artisan queue:work --queue=smtp_validation,dns_validation,bulk_processing,webhooks --tries=3 --timeout=60 --sleep=1
    volumes:
      - .:/var/www/html
    networks:
      - ev_local
    depends_on:
      - mysql
      - redis
      - rabbitmq

  # ============================================================
  # MYSQL 8.0
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: ev_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: email_validator
      MYSQL_USER: ev_user
      MYSQL_PASSWORD: ev_password
    volumes:
      - mysql_local_data:/var/lib/mysql
      - ./docker/mysql/local.cnf:/etc/mysql/conf.d/local.cnf
    networks:
      - ev_local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: ev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    networks:
      - ev_local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes

  # ============================================================
  # RABBITMQ (Message Queue with Management UI)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ev_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ev_admin
      RABBITMQ_DEFAULT_PASS: ev_password
      RABBITMQ_DEFAULT_VHOST: email_validator
    volumes:
      - rabbitmq_local_data:/var/lib/rabbitmq
    networks:
      - ev_local

  # ============================================================
  # MAILPIT (Local Email Testing — no real emails sent)
  # ============================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: ev_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025
    networks:
      - ev_local

  # ============================================================
  # PHPMYADMIN (MySQL GUI)
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ev_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"     # → http://localhost:8080
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_password
    networks:
      - ev_local
    depends_on:
      - mysql
